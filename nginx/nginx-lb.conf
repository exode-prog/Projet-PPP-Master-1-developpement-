# Repartiteur de charge devant les 2 instances du serveur MCP cible (cdc B.4).
#
# IMPORTANT : le protocole MCP (Streamable HTTP) est stateful -- une session
# (en-tete mcp-session-id) doit rester sur la MEME instance pendant toute sa
# duree. Un round-robin brut casserait une session en cours de route. On
# utilise donc un hachage sur cet en-tete : une session donnee est toujours
# dirigee vers la meme instance (coherence), mais des sessions differentes
# se repartissent entre les deux instances (repartition de charge reelle).
#
# Limite assumee : la toute premiere requete d'une session (initialize) n'a
# pas encore d'en-tete mcp-session-id -> hash sur chaine vide -> toutes les
# ouvertures de session atterrissent sur la meme instance. La repartition
# reelle se mesure donc sur plusieurs sessions independantes, pas sur les
# requetes isolees d'une seule session (voir README, etape de test).

upstream target_servers {
    hash $http_mcp_session_id consistent;
    server target-server-1:8000;
    server target-server-2:8000;
}

server {
    listen 8000;

    location / {
        proxy_pass http://target_servers;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header mcp-session-id $http_mcp_session_id;
        proxy_read_timeout 60s;
    }
}
