services:
  localstack:
    image: localstack/localstack:latest
    container_name: localstack-mcp
    ports:
      - "4566:4566"
    environment:
      - SERVICES=lambda
      - DEBUG=1
    env_file:
      - path: .env.localstack
        required: false
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
